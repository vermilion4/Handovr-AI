<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact - Chen's Bakery</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header><strong>Chen's Bakery</strong><nav><a href="../menu.html">Menu</a><a href="https://example.com/">Our supplier</a></nav></header>
<main>
  <section>
    <h1>Get in touch</h1>
    <form id="contact">
      <label for="name">Name</label><input id="name" name="name" required>
      <label for="email">Email</label><input id="email" name="email" type="email" required>
      <label for="message">Message</label><textarea id="message" name="message" rows="4" required></textarea>
      <button type="submit">Send</button>
    </form>
    <p id="sent" class="confirmation hidden" role="status">Thanks, your message was sent. We reply within a day.</p>
  </section>
  <section><h2>Visit us</h2><p>123 Queen Street West, Toronto</p></section>
</main>
<script>
  document.getElementById('contact').addEventListener('submit', function (event) {
    event.preventDefault();
    if (!this.checkValidity()) { this.reportValidity(); return; }
    document.getElementById('sent').classList.remove('hidden');
    this.reset();
  });
</script>
</body>
</html>
